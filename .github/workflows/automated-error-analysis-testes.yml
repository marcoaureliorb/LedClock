name: Testes da Correção Automatizada

# Executa a suíte do agente de correção. Só roda quando o agente muda, para não
# competir com os demais checks do repositório.

on:
  pull_request:
    paths:
      - '.github/correcao-ia/**'
      - '.github/workflows/automated-error-analysis*.yml'
  push:
    paths:
      - '.github/correcao-ia/**'
      - '.github/workflows/automated-error-analysis*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: node --test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar os testes
        run: node .github/correcao-ia/testes/executar.mjs .github/correcao-ia/testes

      - name: Ensaio offline do fluxo completo
        env:
          GITHUB_TOKEN: token-de-ensaio
          GITHUB_REPOSITORY: exemplo/led-clock
          CORRECAO_NUMERO_ISSUE: '1'
          AZURE_OPENAI_API_KEY: chave-de-ensaio
          AZURE_OPENAI_ENDPOINT: https://ensaio.openai.azure.com
          AZURE_OPENAI_DEPLOYMENT: ensaio
          CORRECAO_SIMULACAO: 'true'
        run: |
          node --import ./.github/correcao-ia/ensaio/stub-offline.mjs \
            .github/correcao-ia/src/index.mjs executar
